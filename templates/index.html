<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NonVeg Buddy</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #fdf3ee;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 560px;
      height: 90vh;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #c0392b;
      color: #ffffff;
      padding: 16px 20px;
    }

    .chat-header h1 {
      font-size: 1.2rem;
    }

    .chat-header p {
      font-size: 0.85rem;
      opacity: 0.9;
      margin-top: 2px;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #faf7f5;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #c0392b;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      align-self: flex-start;
      background: #ffffff;
      color: #333333;
      border: 1px solid #eadfd9;
      border-bottom-left-radius: 4px;
    }

    .message.error {
      align-self: center;
      background: #fdecea;
      color: #a94442;
      font-size: 0.85rem;
    }

    .chat-input {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #eee;
      background: #ffffff;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 24px;
      font-size: 0.95rem;
      outline: none;
    }

    .chat-input input:focus {
      border-color: #c0392b;
    }

    .chat-input button {
      padding: 0 20px;
      border: none;
      border-radius: 24px;
      background: #c0392b;
      color: #ffffff;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .chat-input button:disabled {
      background: #d9a49e;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>🍗 NonVeg Buddy</h1>
      <p>Ask me anything about non-veg foods</p>
    </div>

    <div class="chat-messages" id="messages"></div>

    <div class="chat-input">
      <input
        type="text"
        id="userInput"
        placeholder="e.g. How do I make butter chicken?"
        autocomplete="off"
      />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const messagesBox = document.getElementById("messages");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    let history = [];

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      messagesBox.appendChild(div);
      messagesBox.scrollTop = messagesBox.scrollHeight;
      return div;
    }

    function setLoading(isLoading) {
      sendBtn.disabled = isLoading;
      userInput.disabled = isLoading;
      if (!isLoading) userInput.focus();
    }

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;

      addMessage(message, "user");
      userInput.value = "";
      setLoading(true);

      const typing = addMessage("Typing...", "bot");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history }),
        });
        const data = await response.json();
        typing.remove();

        if (!response.ok) {
          addMessage(data.error || "Something went wrong.", "error");
        } else {
          addMessage(data.reply, "bot");
          history.push({ role: "user", text: message });
          history.push({ role: "model", text: data.reply });
        }
      } catch (error) {
        typing.remove();
        addMessage("Could not reach the server.", "error");
      } finally {
        setLoading(false);
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendMessage();
    });

    addMessage(
      "Hi! I'm NonVeg Buddy. Ask me about chicken, mutton, fish, eggs, seafood and more.",
      "bot"
    );
  </script>
</body>
</html>
